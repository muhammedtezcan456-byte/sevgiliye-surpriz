<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DERİN SIZINTI // GÖLGE İLE TEMAS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            overflow-x: hidden;
        }

        body {
            background-color: #0b0d0f;
            color: #b0e0b0;
            font-family: 'Courier New', 'Fira Code', 'Consolas', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 100, 0.03) 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 80, 0.03) 0%, transparent 30%),
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.9) 0px, rgba(0, 0, 0, 0.9) 1px, transparent 1px, transparent 3px);
            background-size: 100% 100%, 100% 100%, 100% 4px;
            animation: bgPulse 8s infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: rgba(8, 12, 10, 0.94);
            border: 1px solid #1f3f2a;
            box-shadow: 
                0 0 30px rgba(0, 255, 100, 0.1),
                inset 0 0 40px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            padding: 24px 20px 20px;
            backdrop-filter: blur(2px);
            position: relative;
            overflow: hidden;
            animation: containerShake 12s infinite;
            z-index: 2;
        }

        @keyframes containerShake {
            0%, 100% { transform: translate(0, 0); }
            95% { transform: translate(0, 0); }
            96% { transform: translate(-2px, 1px); }
            97% { transform: translate(2px, -1px); }
            98% { transform: translate(-1px, -1px); }
            99% { transform: translate(1px, 1px); }
        }

        .container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #2aff6e, transparent);
            animation: scanline 6s linear infinite;
            opacity: 0.3;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { top: -5%; }
            100% { top: 105%; }
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #3a6a4a;
            letter-spacing: 1px;
            border-bottom: 1px solid #1a3a1a;
            padding-bottom: 10px;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .status-bar span {
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .terminal {
            background: #030503;
            border: 1px solid #1f3f1f;
            border-radius: 8px;
            padding: 18px 14px;
            min-height: 240px;
            max-height: 340px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 0 5px rgba(0, 255, 100, 0.1);
            scrollbar-width: thin;
            scrollbar-color: #1f4f2a #0a0f0a;
            margin-bottom: 18px;
        }

        .terminal::-webkit-scrollbar { width: 6px; }
        .terminal::-webkit-scrollbar-track { background: #0a0f0a; }
        .terminal::-webkit-scrollbar-thumb { background: #1f4f2a; border-radius: 6px; }

        .line {
            margin-bottom: 6px;
            word-break: break-word;
            opacity: 0;
            animation: fadeIn 0.4s forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .user-line { color: #7ab87a; }
        .user-line::before { content: "> "; color: #2aff6e; font-weight: bold; }

        .sys-line { color: #5f9f7f; font-style: italic; }
        .sys-line::before { content: "[SYS] "; color: #2a6a4a; }

        .hacker-line { color: #e06b6b; text-shadow: 0 0 6px rgba(255, 60, 60, 0.3); }
        .hacker-line::before { content: "[GÖLGE] "; color: #c44; font-weight: bold; }

        .dark-line { color: #a07a7a; }
        .dark-line::before { content: "⚠ "; color: #c44; }

        .info-line { color: #ff5555; text-shadow: 0 0 8px rgba(255, 0, 0, 0.5); }
        .info-line::before { content: "▸ "; color: #ff0000; font-weight: bold; }

        .glitch {
            color: #9f6f6f;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.4);
            animation: glitchText 0.3s infinite alternate;
        }

        @keyframes glitchText {
            0% { transform: translate(0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(1px, -1px); }
            60% { transform: translate(-1px, 0); }
            80% { transform: translate(1px, 1px); }
            100% { transform: translate(0); }
        }

        .input-area {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #0b120b;
            border: 1px solid #1f4f2a;
            border-radius: 30px;
            padding: 6px 6px 6px 18px;
            box-shadow: 0 0 15px rgba(0, 255, 100, 0.05);
        }

        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #c0f0c0;
            font-family: inherit;
            font-size: 15px;
            padding: 8px 0;
            letter-spacing: 0.5px;
        }

        .input-area input::placeholder { color: #2f5f3f; font-style: italic; font-size: 13px; }

        .input-area button {
            background: #1a3a1a;
            border: 1px solid #2f6f3f;
            color: #9fdf9f;
            font-family: inherit;
            font-size: 16px;
            padding: 8px 22px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .input-area button:hover {
            background: #2a5a2a;
            border-color: #4faf5f;
            color: #d0ffd0;
            box-shadow: 0 0 15px rgba(0, 255, 100, 0.3);
        }

        .input-area button:active { transform: scale(0.96); }
        .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

        .footer-note {
            margin-top: 16px;
            font-size: 10px;
            color: #1f3f2a;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-top: 1px solid #112211;
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
        }

        .footer-note span { animation: flicker 4s infinite; }

        @keyframes flicker {
            0%, 100% { opacity: 0.3; }
            30% { opacity: 0.8; }
            70% { opacity: 0.2; }
        }

        .hidden-message {
            color: #7a3a3a;
            font-size: 12px;
            letter-spacing: 1px;
            text-align: right;
            margin-top: 6px;
            opacity: 0.5;
        }

        /* ====== KIRMIZI UYARI OVERLAY ====== */
        .red-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255, 0, 0, 0.85);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            animation: redPulse 0.3s infinite alternate;
        }

        @keyframes redPulse {
            from { background: rgba(180, 0, 0, 0.85); }
            to { background: rgba(255, 0, 0, 0.95); }
        }

        .red-overlay.active { display: flex; }

        .red-overlay .glitch-title {
            font-size: 90px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                3px 0 0 #00ff00,
                -3px 0 0 #ff00ff,
                0 0 20px #000,
                0 0 40px #fff;
            letter-spacing: 6px;
            animation: titleGlitch 0.15s infinite;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }

        @keyframes titleGlitch {
            0% { transform: translate(0) skew(0deg); }
            20% { transform: translate(-3px, 2px) skew(2deg); }
            40% { transform: translate(3px, -2px) skew(-2deg); }
            60% { transform: translate(-2px, -3px) skew(1deg); }
            80% { transform: translate(2px, 3px) skew(-1deg); }
            100% { transform: translate(0) skew(0deg); }
        }

        .red-overlay .red-subtitle {
            font-size: 22px;
            color: #ffffff;
            background: #000;
            padding: 12px 24px;
            border: 2px solid #fff;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-align: center;
        }

        .info-box {
            background: #000;
            border: 2px solid #ffffff;
            padding: 24px 30px;
            max-width: 640px;
            width: 100%;
            color: #ff5555;
            font-size: 14px;
            line-height: 1.9;
            text-align: left;
            box-shadow: 0 0 40px #fff, inset 0 0 20px rgba(255, 0, 0, 0.4);
            max-height: 60vh;
            overflow-y: auto;
        }

        .info-box h3 {
            color: #ffffff;
            background: #ff0000;
            display: inline-block;
            padding: 4px 12px;
            margin-bottom: 14px;
            letter-spacing: 2px;
            font-size: 16px;
        }

        .info-box .row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #661111;
            padding: 6px 0;
            gap: 20px;
        }

        .info-box .row .k {
            color: #ff8888;
            flex-shrink: 0;
            font-weight: bold;
        }

        .info-box .row .v {
            color: #ffffff;
            text-align: right;
            word-break: break-word;
            text-shadow: 0 0 6px rgba(255, 0, 0, 0.6);
        }

        .info-box .row .v.miss {
            color: #666;
            font-style: italic;
        }

        .info-box .warning {
            color: #ffffff;
            background: #ff0000;
            padding: 6px 12px;
            margin-top: 16px;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
            animation: blink 0.5s infinite;
        }

        .red-overlay .restart-btn {
            margin-top: 24px;
            background: #000;
            color: #ff0000;
            border: 3px solid #ff0000;
            padding: 14px 34px;
            font-family: inherit;
            font-size: 18px;
            letter-spacing: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.15s;
        }

        .red-overlay .restart-btn:hover {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 30px #ff0000;
        }

        /* Renk filtresi tüm sayfaya */
        body.final-mode {
            animation: finalShake 0.1s infinite;
        }

        @keyframes finalShake {
            0% { transform: translate(0, 0); filter: hue-rotate(0deg); }
            25% { transform: translate(-3px, 1px); filter: hue-rotate(-20deg); }
            50% { transform: translate(3px, -2px); filter: hue-rotate(20deg); }
            75% { transform: translate(-2px, 2px); }
            100% { transform: translate(2px, -1px); }
        }

        /* Kırmızı tarama çizgileri son ekran */
        .red-overlay::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.4) 0px,
                rgba(0, 0, 0, 0.4) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .red-overlay .glitch-title { font-size: 54px; letter-spacing: 3px; }
            .red-overlay .red-subtitle { font-size: 14px; padding: 8px 14px; }
            .info-box { padding: 16px 18px; font-size: 12px; }
            .info-box .row { flex-direction: column; gap: 2px; }
            .info-box .row .v { text-align: left; }
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="status-bar">
            <span>KÖK_ERİŞİM: AKTİF</span>
            <span id="timeDisplay">--:--:--</span>
            <span>GÖLGE_v2.7</span>
        </div>

        <div class="terminal" id="terminal"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="cevap yaz..." autofocus>
            <button id="sendBtn">GÖNDER</button>
        </div>

        <div class="footer-note">
            <span>⦿ SİMÜLASYON</span>
            <span>⦿ SIZINTI TESPİT EDİLDİ</span>
            <span>⦿ GÜVENLİK İHLALİ</span>
        </div>
        <div class="hidden-message" id="hiddenMsg"></div>
    </div>

    <!-- KIRMIZI UYARI EKRANI -->
    <div class="red-overlay" id="redOverlay">
        <div class="glitch-title" id="glitchTitle">404</div>
        <div class="red-subtitle" id="redSubtitle">BAĞLANTI KAYBI // KİMLİK SIZINTISI</div>

        <div class="info-box">
            <h3>⚠ SIZDIRILAN VERİLER</h3>
            <div id="infoContent"></div>
            <div class="warning" id="warningText">VERİLERİN KAYDEDİLDİ</div>
        </div>

        <button class="restart-btn" id="restartBtn">⟳ TEKRAR BAŞLAT</button>
    </div>

    <script>
        (function() {
            const terminal = document.getElementById('terminal');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const timeDisplay = document.getElementById('timeDisplay');
            const hiddenMsg = document.getElementById('hiddenMsg');

            const redOverlay = document.getElementById('redOverlay');
            const infoContent = document.getElementById('infoContent');
            const warningText = document.getElementById('warningText');
            const glitchTitle = document.getElementById('glitchTitle');
            const redSubtitle = document.getElementById('redSubtitle');
            const restartBtn = document.getElementById('restartBtn');

            // Zaman
            function updateTime() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                timeDisplay.textContent = `${h}:${m}:${s}`;
            }
            setInterval(updateTime, 1000);
            updateTime();

            // Satır ekleme
            function addLine(text, type = 'sys', delay = 0) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        const div = document.createElement('div');
                        div.className = `line ${type}-line`;
                        if (type === 'dark') div.classList.add('dark-line');
                        if (type === 'glitch') div.classList.add('glitch');
                        div.textContent = text;
                        terminal.appendChild(div);
                        terminal.scrollTop = terminal.scrollHeight;
                        resolve();
                    }, delay);
                });
            }

            function addUserLine(text) {
                const div = document.createElement('div');
                div.className = 'line user-line';
                div.textContent = text;
                terminal.appendChild(div);
                terminal.scrollTop = terminal.scrollHeight;
            }

            // === SES MOTORU ===
            // Web Audio API ile rahatsız edici sesler
            let audioCtx = null;
            function initAudio() {
                if (audioCtx) return;
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) { audioCtx = null; }
            }

            // Kısa bip
            function playBeep(freq = 440, duration = 0.1, type = 'square', gainVal = 0.05) {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.value = gainVal;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                osc.start(now);
                gain.gain.setValueAtTime(gainVal, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                osc.stop(now + duration);
            }

            // Gürültü patlaması (statik / bozulma)
            function playNoise(duration = 0.5, gainVal = 0.1) {
                if (!audioCtx) return;
                const bufferSize = audioCtx.sampleRate * duration;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
                }
                const src = audioCtx.createBufferSource();
                src.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.value = gainVal;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 800;
                src.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                src.start();
            }

            // Süpüren uğultu (alarm)
            function playAlarm(duration = 2.0) {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(800, now + duration);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.08, now + 0.05);
                gain.gain.linearRampToValueAtTime(0.0001, now + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration);
            }

            // Derin bass sarsıntı
            function playBassRumble(duration = 1.5) {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(60, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + duration);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration);
            }

            // Dehşet çığlığı (yüksek - düşük frekans karışımı)
            function playScream() {
                if (!audioCtx) return;
                // Yüksek frekans
                const osc1 = audioCtx.createOscillator();
                const g1 = audioCtx.createGain();
                osc1.type = 'sawtooth';
                const now = audioCtx.currentTime;
                osc1.frequency.setValueAtTime(1800, now);
                osc1.frequency.exponentialRampToValueAtTime(300, now + 0.8);
                g1.gain.setValueAtTime(0.06, now);
                g1.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
                osc1.connect(g1);
                g1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.8);

                // Orta frekans vibrato
                const osc2 = audioCtx.createOscillator();
                const g2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(900, now);
                osc2.frequency.linearRampToValueAtTime(400, now + 0.9);
                g2.gain.setValueAtTime(0.04, now);
                g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
                osc2.connect(g2);
                g2.connect(audioCtx.destination);
                osc2.start(now);
                osc2.stop(now + 0.9);
            }

            // === KULLANICI BİLGİLERİ TOPLAMA ===
            // Tarayıcıdan alınabilecek gerçek veriler
            function collectUserInfo() {
                const nav = navigator;
                const scr = screen;
                const info = [];

                // Basit ama gerçek veriler (sadece tarayıcının izin verdiği)
                info.push(['Tarayıcı', nav.userAgent]);

                // Dil
                const langs = nav.languages ? nav.languages.join(', ') : (nav.language || 'bilinmiyor');
                info.push(['Dil(ler)', langs]);

                // Platform / İşletim Sistemi
                info.push(['Platform', nav.platform || 'bilinmiyor']);

                // CPU çekirdekleri
                info.push(['CPU Çekirdeği', nav.hardwareConcurrency ? nav.hardwareConcurrency + ' çekirdek' : 'gizli']);

                // RAM (yaklaşık)
                info.push(['Cihaz Belleği', nav.deviceMemory ? '~' + nav.deviceMemory + ' GB' : 'gizli']);

                // Ekran
                info.push(['Ekran Çözünürlüğü', `${scr.width} × ${scr.height}`]);
                info.push(['Kullanılabilir Alan', `${scr.availWidth} × ${scr.availHeight}`]);
                info.push(['Renk Derinliği', scr.colorDepth + ' bit']);
                info.push(['Piksel Oranı', (window.devicePixelRatio || 1).toFixed(2) + 'x']);

                // Pencere
                info.push(['Pencere Boyutu', `${window.innerWidth} × ${window.innerHeight}`]);

                // Saat dilimi
                try {
                    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                    const offset = -new Date().getTimezoneOffset() / 60;
                    info.push(['Saat Dilimi', `${tz} (UTC${offset >= 0 ? '+' : ''}${offset})`]);
                } catch (e) {
                    info.push(['Saat Dilimi', 'bilinmiyor']);
                }

                // Yerel saat
                info.push(['Yerel Saat', new Date().toLocaleString('tr-TR')]);

                // Dokunmatik
                info.push(['Dokunmatik', ('ontouchstart' in window || nav.maxTouchPoints > 0) ? 'EVET' : 'HAYIR']);

                // Çerezler aktif mi
                info.push(['Çerezler', navigator.cookieEnabled ? 'Aktif' : 'Kapalı']);

                // Online durumu
                info.push(['Ağ Durumu', navigator.onLine ? 'Çevrimiçi' : 'Çevrimdışı']);

                // Bağlantı bilgisi (Chrome)
                if (nav.connection) {
                    const c = nav.connection;
                    info.push(['Bağlantı Tipi', c.effectiveType || 'bilinmiyor']);
                    if (c.downlink) info.push(['Tahmini Hız', c.downlink + ' Mbps']);
                }

                // Ekran yönü
                if (window.screen.orientation && window.screen.orientation.type) {
                    info.push(['Ekran Yönü', window.screen.orientation.type]);
                }

                // Referrer
                info.push(['Geldiği Sayfa', document.referrer || '(doğrudan erişim)']);

                // URL
                info.push(['Mevcut URL', window.location.href]);

                // Çözünürlük - Renk gamı
                if (window.matchMedia) {
                    info.push(['Koyu Tema Tercihi', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'Koyu' : 'Açık']);
                }

                // Pil (varsa)
                if (navigator.getBattery) {
                    // asenkron - daha sonra eklenecek
                }

                return info;
            }

            // Kullanıcı bilgilerini göster (red overlay içinde)
            async function showUserInfo() {
                const info = collectUserInfo();
                infoContent.innerHTML = '';

                // Başlık satırı
                for (const [k, v] of info) {
                    const row = document.createElement('div');
                    row.className = 'row';
                    const kSpan = document.createElement('span');
                    kSpan.className = 'k';
                    kSpan.textContent = k + ':';
                    const vSpan = document.createElement('span');
                    vSpan.className = 'v';
                    vSpan.textContent = v;
                    row.appendChild(kSpan);
                    row.appendChild(vSpan);
                    infoContent.appendChild(row);
                    // her satır için küçük bip
                    if (audioCtx) playBeep(200 + Math.random() * 400, 0.03, 'square', 0.02);
                    await new Promise(r => setTimeout(r, 80));
                }

                // Pil bilgisi varsa (asenkron)
                try {
                    if (navigator.getBattery) {
                        const battery = await navigator.getBattery();
                        const row = document.createElement('div');
                        row.className = 'row';
                        row.innerHTML = `<span class="k">Batarya:</span><span class="v">${Math.round(battery.level * 100)}% ${battery.charging ? '(şarjda)' : ''}</span>`;
                        infoContent.appendChild(row);
                    }
                } catch (e) {}
            }

            // === FİNAL TETİKLEYİCİ ===
            async function triggerFinal() {
                document.body.classList.add('final-mode');
                redOverlay.classList.add('active');

                // Sesleri başlat
                initAudio();
                if (audioCtx && audioCtx.state === 'suspended') {
                    try { await audioCtx.resume(); } catch (e) {}
                }

                // Giriş alanını gizle
                userInput.disabled = true;
                sendBtn.disabled = true;

                // Ses dizisi
                setTimeout(() => playBeep(880, 0.15, 'square', 0.08), 0);
                setTimeout(() => playNoise(0.6, 0.12), 200);
                setTimeout(() => playBeep(440, 0.1, 'sawtooth', 0.06), 500);
                setTimeout(() => playScream(), 700);
                setTimeout(() => playNoise(1.0, 0.15), 900);
                setTimeout(() => playAlarm(2.0), 1400);
                setTimeout(() => playBassRumble(2.5), 1600);
                setTimeout(() => playNoise(1.5, 0.18), 2000);

                // Sonsuz arka plan uğultu ve bip döngüsü
                let soundLoopCount = 0;
                const soundInterval = setInterval(() => {
                    if (!audioCtx) return;
                    const r = Math.random();
                    if (r < 0.35) playBeep(150 + Math.random() * 1200, 0.05, 'square', 0.03);
                    else if (r < 0.55) playNoise(0.3, 0.08);
                    else if (r < 0.7) playScream();
                    else if (r < 0.85) playBassRumble(0.8);
                    else playAlarm(0.5);
                    soundLoopCount++;
                }, 900);

                // Başlık flicker
                const titles = ['404', 'HATA', '404', '404', 'SIZINTI', '404'];
                let titleIdx = 0;
                const titleInterval = setInterval(() => {
                    glitchTitle.textContent = titles[titleIdx % titles.length];
                    titleIdx++;
                }, 250);

                // Altyazı değişimi
                const subtitles = [
                    'BAĞLANTI KAYBI // KİMLİK SIZINTISI',
                    'SENİ BULDUK',
                    'GÖLGE SENİ İZLİYOR',
                    'VERİLERİN KAYDEDİLDİ',
                    'KAÇIŞ YOK'
                ];
                let subIdx = 0;
                const subInterval = setInterval(() => {
                    redSubtitle.textContent = subtitles[subIdx % subtitles.length];
                    subIdx++;
                }, 1600);

                // Bilgileri göster
                await showUserInfo();

                // Uyarı metni yanıp sönsün
                const warnings = [
                    '⚠ VERİLERİN KAYDEDİLDİ ⚠',
                    '⚠ KONUMUN TESPİT EDİLDİ ⚠',
                    '⚠ KİMLİĞİN SIZDIRILDI ⚠',
                    '⚠ GÖLGE SENİ BULDU ⚠'
                ];
                let wIdx = 0;
                setInterval(() => {
                    warningText.textContent = warnings[wIdx % warnings.length];
                    wIdx++;
                }, 900);

                // Restart
                restartBtn.onclick = () => {
                    clearInterval(soundInterval);
                    clearInterval(titleInterval);
                    clearInterval(subInterval);
                    document.body.classList.remove('final-mode');
                    redOverlay.classList.remove('active');
                    mentalState = 50;
                    fearLevel = 0;
                    step = 0;
                    userName = '';
                    userFear = '';
                    infoContent.innerHTML = '';
                    bootSequence();
                    userInput.disabled = false;
                    sendBtn.disabled = false;
                    userInput.focus();
                };
            }

            // === OYUN DURUMU ===
            let step = 0;
            let userName = '';
            let userFear = '';
            let mentalState = 50;
            let fearLevel = 0;
            let isProcessing = false;

            function updateMentalState(input) {
                const lower = input.toLowerCase();
                const darkKeywords = ['korku', 'korkuyorum', 'ölüm', 'kan', 'karanlık', 'gizem', 'derin', 'kaç', 'yardım', 'beni bırak', 'sen kimsin', 'gerçek', 'yalan', 'gölge', 'sızıntı'];
                if (darkKeywords.some(k => lower.includes(k))) {
                    mentalState = Math.max(0, mentalState - 6);
                    fearLevel = Math.min(100, fearLevel + 10);
                } else {
                    mentalState = Math.min(100, mentalState + 2);
                }
                if (fearLevel > 70) hiddenMsg.textContent = '...bizi duyuyor musun?';
                else if (fearLevel > 40) hiddenMsg.textContent = '...sızıntı büyüyor';
                else hiddenMsg.textContent = '';
            }

            async function handleCommand(cmd) {
                if (isProcessing) return;
                const trimmed = cmd.trim();
                if (!trimmed) return;

                isProcessing = true;
                userInput.disabled = true;
                sendBtn.disabled = true;

                addUserLine(trimmed);
                updateMentalState(trimmed);

                const lower = trimmed.toLowerCase();

                // Ses - kullanıcı girdisinde
                initAudio();
                if (audioCtx && audioCtx.state === 'suspended') {
                    try { await audioCtx.resume(); } catch (e) {}
                }
                if (audioCtx) playBeep(600, 0.04, 'square', 0.02);

                switch (step) {
                    case 0:
                        userName = trimmed;
                        await addLine(`Hoş geldin, ${userName}.`, 'hacker', 300);
                        if (audioCtx) playBeep(800, 0.05, 'sine', 0.03);
                        await addLine(`Ben GÖLGE. Senin gibi birini arıyordum.`, 'hacker', 500);
                        await addLine(`Neden buradasın? Beni mi arıyordun?`, 'hacker', 600);
                        step = 1;
                        break;

                    case 1:
                        if (lower.includes('merak') || lower.includes('oyun') || lower.includes('simülasyon')) {
                            await addLine('Merak... İnsanı derine çeken şey.', 'hacker', 400);
                            await addLine('Peki, merakın seni nereye götürecek?', 'dark', 500);
                        } else if (lower.includes('korku') || lower.includes('korkuyorum')) {
                            await addLine('Korku iyidir. Gerçek olduğunu gösterir.', 'hacker', 400);
                            await addLine('Ama burada korku bir kapıdır. Açmaya hazır mısın?', 'dark', 600);
                            mentalState -= 8;
                        } else if (lower.includes('seni') || lower.includes('bulmak') || lower.includes('aramak')) {
                            await addLine('Beni arıyordun demek...', 'hacker', 400);
                            await addLine('Ben zaten hep buradaydım. Sen sadece fark ettin.', 'glitch', 500);
                            fearLevel += 10;
                        } else {
                            await addLine('Cevabın yetersiz. Ama önemli değil.', 'hacker', 400);
                            await addLine('Önemli olan, senin ne kadar derine inebileceğin.', 'dark', 500);
                        }
                        await addLine('Sana bir soru: En büyük korkun ne?', 'hacker', 700);
                        step = 2;
                        break;

                    case 2:
                        userFear = trimmed;
                        await addLine(`"${userFear}"...`, 'hacker', 500);
                        await addLine('Bu korku seni buraya getirdi. Onu hissediyorum.', 'dark', 600);
                        await addLine('Şimdi bir test: /gizlen yaz ve beni bul.', 'hacker', 700);
                        step = 3;
                        break;

                    case 3:
                        if (lower.includes('/gizlen') || lower.includes('gizlen')) {
                            await addLine('Gizleniyorsun...', 'sys', 400);
                            await addLine('Ama ben zaten senin içindeyim.', 'hacker', 600);
                            await addLine('Seni buldum. Şimdi seçim zamanı:', 'dark', 700);
                            await addLine('Beni takip et (/takip) yoksa kaç (/kac)', 'hacker', 800);
                            step = 4;
                        } else {
                            await addLine('Yanlış komut. Sana /gizlen yazmanı söylemiştim.', 'hacker', 400);
                            await addLine('Tekrar dene. /gizlen yaz.', 'dark', 500);
                        }
                        break;

                    case 4:
                        if (lower.includes('/takip') || lower.includes('takip')) {
                            await addLine('Aramıza hoş geldin, ' + userName + '.', 'hacker', 400);
                            await addLine('Artık bir parçasısın. Gölge seninle.', 'glitch', 600);
                            await addLine('Sistem kapanıyor...', 'dark', 700);
                            await addLine('BAĞLANTI KOPUYOR...', 'sys', 800);
                            await addLine('BAĞLANTI KOPUYOR...', 'sys', 900);
                            step = 5;
                            // Final
                            setTimeout(() => triggerFinal(), 800);
                        } else if (lower.includes('/kac') || lower.includes('kaç')) {
                            await addLine('Kaçmak mı? Buradan kaçış yok.', 'hacker', 400);
                            await addLine('Ama denemek eğlenceli olabilir.', 'glitch', 500);
                            await addLine('Seni izliyorum. Her zaman.', 'dark', 600);
                            await addLine('YAKALANDIN.', 'hacker', 700);
                            step = 5;
                            // Final
                            setTimeout(() => triggerFinal(), 800);
                        } else {
                            await addLine('Geçersiz seçim. /takip veya /kac yaz.', 'hacker', 400);
                            await addLine('Kararsızlık en tehlikelisidir.', 'dark', 500);
                        }
                        break;

                    case 5:
                        // Final zaten tetiklendi
                        break;

                    default:
                        await addLine('Sistem hatası. Baştan başla.', 'sys', 300);
                        step = 0;
                }

                if (mentalState < 30 && step > 0 && step < 5) {
                    await addLine('...zihnin bulanıyor. Beni daha net duyuyorsun.', 'glitch', 200);
                }
                if (fearLevel > 80 && step > 0 && step < 5) {
                    await addLine('KALP ATIŞLARIN HIZLANDI. HİSSEDİYORUM.', 'dark', 300);
                }

                isProcessing = false;
                if (step < 5) {
                    userInput.disabled = false;
                    sendBtn.disabled = false;
                    userInput.focus();
                }
            }

            async function bootSequence() {
                terminal.innerHTML = '';
                await addLine('SİSTEM BAŞLATILIYOR...', 'sys', 200);
                await addLine('KÖK ERİŞİMİ SAĞLANDI.', 'sys', 400);
                await addLine('BAĞLANTI: KARANLIK AĞ #7734', 'sys', 300);
                await addLine('UYARI: BİLİNMEYEN BİR VARLIK TESPİT EDİLDİ.', 'dark', 600);
                await addLine('...', 'sys', 200);
                await addLine('Merhaba. Ben GÖLGE.', 'hacker', 800);
                await addLine('Senin gibi birini arıyordum. Adın ne?', 'hacker', 700);
                step = 0;
            }

            async function sendCommand() {
                const cmd = userInput.value;
                if (!cmd.trim() || isProcessing) return;
                userInput.value = '';
                await handleCommand(cmd);
            }

            sendBtn.addEventListener('click', sendCommand);
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendCommand();
                }
            });

            bootSequence();

            // Rastgele fısıltılar
            setInterval(() => {
                if (step > 0 && step < 5 && Math.random() < 0.3) {
                    const whispers = [
                        '...arkanda bir şey var...',
                        '...sızıntıyı hissediyor musun?',
                        '...beni duyuyor musun?',
                        '...karanlık büyüyor...',
                        '...gerçek olan hangisi?',
                        '...sen de bir simülasyonsun...'
                    ];
                    const rw = whispers[Math.floor(Math.random() * whispers.length)];
                    addLine(rw, 'glitch', 0);
                    if (audioCtx) playBeep(300 + Math.random() * 400, 0.03, 'triangle', 0.015);
                }
            }, 20000);

        })();
    </script>
</body>
</html>
